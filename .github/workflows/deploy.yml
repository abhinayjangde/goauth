name: Deploy Go API

on:
  push:
    paths-ignore:
      - '**/*.md'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Verify Go
        run: go version

      - name: Download Dependencies
        run: go mod tidy

      - name: Build Binary
        run: |
          go build -o goauth ./cmd

      - name: Upload Binary
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./"
          target: "/home/ubuntu/goauth/"

      - name: Restart Service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            sudo systemctl restart goauth
            sudo systemctl status goauth --no-pager